[project]
name = "factory"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "lxnyax", email = "lxnyax@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=1.60",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "rich>=15.0.0",
    "rstr>=3.2.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"
